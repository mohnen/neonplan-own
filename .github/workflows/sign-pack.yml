name: Sign furniture packs

on:
  push:
    paths:
      - packs/gen_*.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out neonplan3d (signing tool)
        uses: actions/checkout@v4
        with:
          repository: Mastershort/neonplan3d
          path: neonplan3d

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install cryptography voluptuous

      - name: Regenerate pack sources
        run: |
          for gen in packs/gen_*_pack.py; do
            python "$gen"
          done

      - name: Sign packs
        env:
          PACK_SIGNING_KEY: ${{ secrets.PACK_SIGNING_KEY }}
        run: |
          printf '%s' "$PACK_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          for src in packs/*.json; do
            python neonplan3d/tools/fp3dpack.py sign "$src" --key "$RUNNER_TEMP/key.pem"
          done
          rm -f "$RUNNER_TEMP/key.pem"

      - name: Commit regenerated packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs/*.json packs/*.fp3dpack
          git diff --cached --quiet || git commit -m "Rebuild and sign furniture packs"
          git push
